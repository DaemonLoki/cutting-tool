[project]
name = "cutter"
version = "0.1.0"
description = "Local rough cut of one English video from one speaker's sources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5",
    "natsort>=8",
    "numpy>=2",
    "openai>=1",
    "parakeet-mlx>=0.4",
    "pydantic>=2",
    "pyyaml>=6",
    "rapidfuzz>=3",
    "rich>=13",
    "soundfile>=0.12",
    "typer>=0.12",
]

[project.scripts]
cutter = "cutter.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["cutter", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["cutter"]
