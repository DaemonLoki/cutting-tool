# Thresholds for one English speaker, one camera, long-form.
# What each key does, and which way to turn it, is in profiles/long.md.
# Try one change with: cutter run <project> --set retakes.min_match_words=2

ingest:
  # Extensions in raw/. Case is ignored. Hidden files are ignored either way.
  allowed_extensions: [".mov", ".mp4", ".m4v"]
  # Mono WAV sent to Parakeet, in Hz.
  asr_sample_rate: 16000
  # Mono WAV used to snap cut points, in Hz. Source video is not re-encoded.
  analysis_sample_rate: 48000
  # never | auto | always. auto is only sources with a VFR warning. Not applied yet.
  cfr_proxy: "never"
  # prores_proxy | h264. Codec of a constant-frame-rate proxy, when one is made.
  proxy_codec: "prores_proxy"

transcribe:
  # Hugging Face id. The first run downloads this model.
  model: "mlx-community/parakeet-tdt-0.6b-v2"
  # Seconds of audio per Parakeet chunk.
  chunk_duration_s: 120
  # Seconds repeated at each chunk boundary. Keep this below chunk_duration_s.
  overlap_duration_s: 15

retakes:
  # Words compared from the start of the later take and an earlier run.
  # Raise when the shared opening is longer than this.
  window_words: 20
  # Shortest similar run that counts as a retake. Lower catches shorter restarts.
  # Matches under 5 words still need one word that is not a stopword.
  min_match_words: 3
  # Rapidfuzz ratio, 0–100. Lower treats more spellings as the same word.
  word_similarity: 85
  # Non-matching words allowed inside the window when the next word matches.
  # 0 requires an unbroken run.
  max_mismatches: 5
  # Seconds from the later take back to the earlier take. Raise for a longer gap.
  max_lookback_s: 90
  # Aborted spans longer than this stay, flagged long_segment, unless the judge drops them.
  auto_drop_max_s: 20
  # Flag a drop when the retake is missing more than this share of the earlier content words.
  # Raise toward 1 to drop those takes without a flag.
  missing_content_ratio: 0.5
  # null uses the built-in English function words. A path replaces that list.
  stopwords_file: null

judge:
  # false skips the model and keeps the retake decisions.
  enabled: true
  # OpenAI-compatible server. LM Studio is the usual one on this machine.
  base_url: "http://localhost:1234/v1"
  # Name of the model loaded in that server.
  model: "google/gemma-4-12b-qat"
  # Verdicts below this (0–1) stay flagged and do not change the cut.
  min_confidence: 0.7
  # Seconds to wait for one verdict. A timeout leaves decisions unchanged.
  timeout_s: 60

vad:
  # false leaves speech empty. The audio stage still writes its artifact.
  enabled: true
  # silero | energy. energy reuses the loudness already measured for cut points.
  backend: "silero"
  # Silero speech probability. A chunk at or above this counts as voice.
  threshold: 0.5
  # Shorter speech blips are dropped. A clap is about 30 ms, so it does not count.
  min_speech_ms: 100
  # Shorter silences inside speech are bridged into the surrounding segment.
  min_silence_ms: 150
  # Milliseconds added to both ends of each speech segment.
  pad_ms: 30
  # Speech this long, in seconds, with no transcript word inside gets a CHECK marker.
  flag_unheard_speech_s: 2.0

claps:
  # false leaves claps empty. The audio stage still writes its artifact.
  enabled: true
  # Peak above the 1 s rolling median of the 2 ms envelope, in dB.
  min_rise_db: 20
  # The level must fall back within this many milliseconds or the event is rejected.
  max_duration_ms: 60
  # Transients closer than this merge into one clap.
  min_gap_ms: 300
  # Transcript words that must match after a clap. Retakes use their own minimum.
  min_match_words: 2
  # No range may play this many milliseconds before the clap onset.
  exclude_before_ms: 100
  # No range may play this many milliseconds after the clap onset.
  exclude_after_ms: 250

fillers:
  # false writes no filler decisions. The stage still writes its artifact.
  enabled: true
  # Normalized words dropped wherever they occur, except as a sentence's only word.
  words: ["um", "uh", "uhm", "umm", "erm", "hmm", "mhm", "mm", "ah", "eh", "er"]
  # Consecutive normalized words, such as "you know". Empty keeps every phrase.
  phrases: []
  # Dropped only as the first word of a sentence, and only when another word follows.
  sentence_start_words: []
  # A filler run longer than this, in seconds, is kept and flagged filler_long.
  max_duration_s: 1.5

script:
  # Path relative to the project folder. A missing file makes alignment a no-op.
  path: "script.md"
  # Rapidfuzz ratio of a transcript window against a script sentence.
  min_take_score: 80
  # best | last. best keeps the highest score. Ties go to the later take.
  prefer: "best"
  # A smaller gap between the chosen take and an alternate is dropped with a CHECK.
  min_score_gap: 5
  # false keeps an alternate that follows the chosen take and flags it.
  drop_later_takes: true
  # An unscripted passage this long, in seconds, gets a CHECK marker.
  flag_unscripted_s: 20

chapters:
  # false writes no chapter markers. Alignment still records headings it parsed.
  enabled: true
  # Heading levels that become chapter markers. 1 is `#`, 2 is `##`.
  levels: [1, 2]

tighten:
  # Gaps longer than this, in ms, start a new range. Lower removes more silence.
  # This does not decide which repetitions are dropped.
  max_gap_ms: 400
  # Milliseconds kept before the first word of a range.
  pad_head_ms: 80
  # Milliseconds kept after the last word of a range.
  pad_tail_ms: 120
  # Each side of a cut, in ms, searched for the quietest moment. 0 disables the snap.
  snap_window_ms: 150
  # In-point stays at least this far before the first word.
  min_head_ms: 30
  # Out-point stays at least this far after the last word.
  min_tail_ms: 40
  # Loudness is measured in frames of this many milliseconds.
  rms_frame_ms: 10
  # Voice is this many dB above the source's background (its quietest 10%).
  # Raise it when a range still ends in breath or room noise. Lower it when
  # the end of a soft word is cut.
  voice_margin_db: 12
  # This much background inside a word, after its voice, ends the word there.
  # The transcript often stretches the last word of a sentence across the pause.
  # A range never ends more than pad_tail_ms after that point.
  voice_quiet_ms: 300
  # Shorter ranges are merged into a neighbour or removed with a CHECK marker.
  min_range_frames: 6
  # false keeps Phase 1 cut points even when speech segments exist.
  use_vad: true

fcpxml:
  # Must match the DTD below.
  version: "1.14"
  # Missing file: the FCPXML is still written, with a warning.
  dtd_path: "/Applications/Final Cut Pro.app/Contents/Frameworks/Interchange.framework/Versions/A/Resources/FCPXMLv1_14.dtd"
  # {project} is the project folder name.
  event_name: "{project} – cutter"
  project_name: "{project} – rough cut"
  rejects_project_name: "{project} – rejects"
  # audioRole on each clip in Final Cut.
  audio_role: "dialogue"
  # true includes filler drops in the rejects project. false leaves them out.
  rejects_include_fillers: false
  # original | proxy. proxy is only valid when the source has one.
  vfr_media: "original"
